<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rembuk Stunting 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 antialiased">

    <div class="fixed inset-0 -z-10 h-full w-full bg-slate-900">
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-blue-900/40 via-slate-900 to-slate-900"></div>
        <div class="absolute bottom-0 left-0 right-0 top-0 bg-[linear-gradient(to_right,#4f4f4f2e_1px,transparent_1px),linear-gradient(to_bottom,#4f4f4f2e_1px,transparent_1px)] bg-[size:14px_24px]"></div>
    </div>

    <div class="min-h-screen flex items-center justify-center p-6">
        <div class="w-full max-w-md text-center">
            
            <div class="mb-6 inline-block p-1 rounded-full bg-gradient-to-tr from-blue-500 to-purple-500 shadow-xl shadow-blue-500/20">
                <img src="/image/logo.png" alt="Logo" class="w-24 h-24 rounded-full border-4 border-slate-900 object-cover bg-white">
            </div>

            <h1 class="text-2xl md:text-3xl font-extrabold text-white tracking-tight mb-2 uppercase">
                Rembuk Stunting Kecamatan
            </h1>
            <p class="text-blue-300 font-medium mb-1 px-4 mb-8">Kab. Gorontalo 2026</p>
           
            <div class="space-y-4">
                
                <a href="https://drive.google.com/drive/folders/1vLzyLmzXLrOLs1qF3CDe98Rquu99aDt6?usp=sharing" class="group flex items-center p-4 rounded-2xl bg-white/10 border border-white/10 hover:border-blue-400/50 backdrop-blur-md transition-all duration-300 hover:bg-white/20 hover:-translate-y-1">
                    <span class="w-12 h-12 flex items-center justify-center rounded-xl bg-blue-500/20 text-blue-400 group-hover:scale-110 transition-transform">
                        <i class="fa-solid fa-book-open text-xl"></i>
                    </span>
                    <span class="ml-4 text-white font-semibold tracking-wide">MATERI KEGIATAN</span>
                    <i class="fa-solid fa-chevron-right ml-auto text-slate-500 group-hover:text-white transition-colors"></i>
                </a>

                <a href="https://drive.google.com/file/d/1KHnNYw3cAVcesZWJJS8f60TvJlnNYm01/view?usp=sharing" class="group flex items-center p-4 rounded-2xl bg-white/10 border border-white/10 hover:border-emerald-400/50 backdrop-blur-md transition-all duration-300 hover:bg-white/20 hover:-translate-y-1">
                    <span class="w-12 h-12 flex items-center justify-center rounded-xl bg-emerald-500/20 text-emerald-400 group-hover:scale-110 transition-transform">
                        <i class="fa-solid fa-pen-to-square text-xl"></i>
                    </span>
                    <span class="ml-4 text-white font-semibold tracking-wide">BACKGROUND VIRTUAL </span>
                    <i class="fa-solid fa-chevron-right ml-auto text-slate-500 group-hover:text-white transition-colors"></i>
                </a>

                <div class="pt-6 pb-2">
                    <div class="flex items-center gap-4">
                        <div class="h-[1px] flex-1 bg-white/10"></div>
                        <span class="text-[10px] font-bold text-slate-500 uppercase tracking-[0.2em]">Link Zoom Pertemuan</span>
                        <div class="h-[1px] flex-1 bg-white/10"></div>
                    </div>
                </div>

                <div class="grid grid-cols-1 gap-3">
                    <a href="#" class="group flex items-center p-3 rounded-xl bg-slate-800/40 border border-white/5 hover:border-indigo-400/50 transition-all duration-300">
                        <i class="fa-solid fa-video text-indigo-400 mr-3"></i>
                        <span class="text-slate-200 text-sm font-medium uppercase tracking-wider">Hari Pertama</span>
                    </a>
                </div>
            </div>
            <footer class="mt-12 text-slate-500 text-xs tracking-widest uppercase">
                &copy; 2026 Panitia Pelaksana <br>
                <span class="text-slate-600">Kabupaten Gorontalo</span>
            </footer>
        </div>
    </div>

</body>
</html>
