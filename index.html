    <!-- Tailwind -->

          <!-- MAIN LINKS -->
          <div class="space-y-4">
            <a
              v-for="(item, index) in mainLinks"
              :key="index"
              :href="item.url"
              target="_blank"
              class="group flex items-center p-4 rounded-2xl bg-white/10 border border-white/10 hover:border-blue-400/50 backdrop-blur-md transition-all duration-300 hover:bg-white/20 hover:-translate-y-1"
            >
              <span
                class="w-12 h-12 flex items-center justify-center rounded-xl transition-transform group-hover:scale-110"
                :class="item.iconBg + ' ' + item.iconColor"
              >
                <i :class="item.icon + ' text-xl'"></i>
              </span>

              <span class="ml-4 text-white font-semibold tracking-wide">
                {{ item.title }}
              </span>

              <i
                class="fa-solid fa-chevron-right ml-auto text-slate-500 group-hover:text-white"
              ></i>
            </a>
          </div>

          <!-- Divider -->
          <div class="pt-6 pb-2">
            <div class="flex items-center gap-4">
              <div class="h-[1px] flex-1 bg-white/10"></div>
              <span
                class="text-[10px] font-bold text-slate-500 uppercase tracking-[0.2em]"
              >
                Link Zoom
              </span>
              <div class="h-[1px] flex-1 bg-white/10"></div>
            </div>
          </div>

          <!-- ZOOM LINKS -->
          <div class="grid grid-cols-1 gap-3">
            <a
              v-for="(zoom, index) in zoomLinks"
              :key="index"
              :href="zoom.url"
              target="_blank"
              class="group flex items-center p-3 rounded-xl bg-slate-800/40 border border-white/5 hover:border-indigo-400/50 transition-all duration-300"
            >
              <i class="fa-solid fa-video text-indigo-400 mr-3"></i>
              <span
                class="text-slate-200 text-sm font-medium uppercase tracking-wider"
              >
                {{ zoom.title }}
              </span>
            </a>
          </div>

         
          <!-- Footer -->

          >
            &copy; 2026 Panitia Pelaksana <br />
            <span class="text-slate-600">Bidang Dalduk</span>
