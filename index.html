<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PORTAL DASHAT | DPPKB KAB GORONTALO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Quicksand', sans-serif; }
        .card-hover:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <header class="relative overflow-hidden bg-gradient-to-br from-slate-800 via-pink-950 to-blue-950 text-white pb-24 pt-12 px-6 border-b border-slate-800">
        <div class="absolute top-0 right-0 opacity-10 transform translate-x-1/4 -translate-y-1/4">
            <i class="fas fa-child text-[200px] animate-float"></i>
        </div>
        
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between relative z-10">
            <div class="text-center md:text-left md:w-2/3">
                <div class="flex items-center justify-center md:justify-start gap-4 mb-6">
                    <div class="bg-slate-800/80 backdrop-blur-md p-3 rounded-2xl shadow-lg border border-slate-700">
                        <i class="fas fa-utensils text-pink-400 text-3xl"></i>
                    </div>
                    <h2 class="font-bold tracking-widest text-sm uppercase text-slate-300">DPPKB Kabupaten Gorontalo</h2>
                </div>
                <h1 class="text-4xl md:text-6xl font-bold leading-tight mb-4 tracking-wide">
                    PORTAL <span class="text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-yellow-300">DASHAT</span>
                </h1>
                <p class="text-lg md:text-xl text-slate-300 max-w-xl mb-8">
                    Dapur Sehat Atasi Stunting: Memberdayakan keluarga melalui gizi seimbang untuk masa depan anak bangsa yang lebih gemilang.
                </p>
                <div class="flex flex-wrap gap-4 justify-center md:justify-start">
                    <span class="bg-slate-800/60 backdrop-blur-md px-4 py-2 rounded-full text-sm font-semibold border border-slate-700 text-pink-300">
                        <i class="fas fa-heart text-pink-400 mr-2"></i> Kasih Sayang Ibu
                    </span>
                    <span class="bg-slate-800/60 backdrop-blur-md px-4 py-2 rounded-full text-sm font-semibold border border-slate-700 text-green-300">
                        <i class="fas fa-apple-alt text-green-400 mr-2"></i> Gizi Seimbang
                    </span>
                </div>
            </div>
            <div class="hidden md:block md:w-1/3 mt-10 md:mt-0">
                <div class="bg-gradient-to-br from-pink-500/10 to-blue-500/10 p-8 rounded-full border-4 border-slate-700/50 animate-float text-center backdrop-blur-sm">
                    <i class="fas fa-home text-[140px] text-pink-300/80"></i>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-6 -mt-12">
        <div id="portal-container" class="grid grid-cols-1 md:grid-cols-3 gap-8">
            </div>
    </main>

    <footer class="mt-24 bg-slate-950 border-t border-slate-800/80 py-12 px-6">
        <div class="max-w-6xl mx-auto text-center">
            <div class="flex justify-center gap-6 mb-8">
                <a href="#" class="w-11 h-11 flex items-center justify-center rounded-full bg-slate-800 text-slate-300 hover:bg-pink-600 hover:text-white border border-slate-700 transition-all"><i class="fab fa-facebook-f"></i></a>
                <a href="#" class="w-11 h-11 flex items-center justify-center rounded-full bg-slate-800 text-slate-300 hover:bg-pink-600 hover:text-white border border-slate-700 transition-all"><i class="fab fa-instagram"></i></a>
                <a href="#" class="w-11 h-11 flex items-center justify-center rounded-full bg-slate-800 text-slate-300 hover:bg-pink-600 hover:text-white border border-slate-700 transition-all"><i class="fab fa-youtube"></i></a>
            </div>
            <p class="text-slate-400 font-medium">&copy; 2026 DPPKB Kabupaten Gorontalo. Semua Hak Dilindungi.</p>
            <p class="text-sm text-pink-400/80 mt-2 italic">Bersama DASHAT, Kita Putus Rantai Stunting!</p>
        </div>
    </footer>

    <script>
        // Struktur Data Portal (3 Menu Terfokus)
        const portalData = [
            {
                title: "MATERI DASHAT",
                desc: "Informasi, edukasi, dan materi penting seputar program Dapur Sehat Atasi Stunting.",
                icon: "fa-graduation-cap",
                color: "from-pink-500 to-rose-600",
                link: "https://drive.google.com/drive/folders/1m_Bolbp6RPYMMFnqTAmvt1AXg8XQxK6f?usp=drive_link"
            },
            {
                title: "BALIHO KECAMATAN",
                desc: "Media publikasi dan sosialisasi program DASHAT di tingkat Kecamatan Kab. Gorontalo.",
                icon: "fa-map-location-dot",
                color: "from-emerald-400 to-teal-600",
                link: "https://drive.google.com/drive/folders/1D_TOdgvVghNN4YxKXMB70sRrb5RLbG03?usp=drive_link"
            },
            {
                title: "BUKU RESEP",
                desc: "Panduan lengkap menu makanan sehat, bergizi, dan terjangkau untuk cegah stunting.",
                icon: "fa-book-open",
                color: "from-blue-500 to-indigo-600",
                link: "https://drive.google.com/drive/folders/1CP2R5CscUTJ8HQ5Wvj226yMh7qFvMTyN?usp=sharing"
            }
        ];

        // Fungsi untuk merender card
        const renderPortal = () => {
            const container = document.getElementById('portal-container');
            container.innerHTML = portalData.map(item => `
                <div class="group bg-slate-800/50 backdrop-blur-sm rounded-[2rem] p-8 shadow-md border border-slate-800 card-hover transition-all duration-300 relative overflow-hidden flex flex-col justify-between h-full">
                    <div class="absolute -right-10 -top-10 w-32 h-32 bg-gradient-to-br ${item.color} opacity-10 rounded-full group-hover:scale-150 transition-transform duration-500"></div>
                    
                    <div class="relative z-10">
                        <div class="w-16 h-16 bg-gradient-to-br ${item.color} rounded-2xl flex items-center justify-center text-white text-2xl shadow-lg mb-6 group-hover:rotate-6 transition-transform duration-300">
                            <i class="fas ${item.icon}"></i>
                        </div>
                        <h3 class="text-xl font-bold text-slate-100 mb-3 uppercase tracking-wide group-hover:text-pink-300 transition-colors">${item.title}</h3>
                        <p class="text-slate-400 leading-relaxed mb-6 text-sm">
                            ${item.desc}
                        </p>
                    </div>
                    
                    <div class="relative z-10">
                        <a href="${item.link}" class="w-full inline-flex items-center justify-center font-bold text-sm bg-slate-800 hover:bg-slate-700 text-slate-200 py-3.5 px-6 rounded-xl transition-all border border-slate-700 group-hover:border-transparent group-hover:text-white group-hover:bg-gradient-to-r group-hover:${item.color} group-hover:shadow-lg group-hover:shadow-pink-500/20">
                            Akses Menu <i class="fas fa-arrow-right ml-2 text-xs"></i>
                        </a>
                    </div>
                </div>
            `).join('');
        };

        // Jalankan render
        renderPortal();
    </script>
</body>
</html>
